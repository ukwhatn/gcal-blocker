<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --card: #f6f7f9;
        --text: #1f2328;
        --muted: #62676d;
        --border: #d8dce0;
        --accent: #1a73e8;
        --warn: #b7791f;
        --error: #c5221f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1d20;
          --card: #26292d;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --border: #3c4043;
          --accent: #8ab4f8;
          --warn: #fdd663;
          --error: #f28b82;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 12px 48px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 17px;
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .day {
        margin-top: 20px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        padding-bottom: 4px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-top: 8px;
      }
      .card.declined .title {
        text-decoration: line-through;
        color: var(--muted);
      }
      .time {
        color: var(--muted);
        font-size: 13px;
      }
      .title {
        font-weight: 600;
        margin: 2px 0;
        overflow-wrap: anywhere;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        border-radius: 6px;
        padding: 1px 6px;
        margin-left: 6px;
        border: 1px solid currentColor;
      }
      .badge.pending {
        color: var(--warn);
      }
      .badge.error {
        color: var(--error);
      }
      .actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .actions button.selected {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      textarea {
        width: 100%;
        margin-top: 8px;
        min-height: 44px;
        padding: 6px 8px;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        resize: vertical;
      }
      .status {
        color: var(--muted);
        padding: 24px 0;
        text-align: center;
      }
      .status.error {
        color: var(--error);
      }
      details summary {
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        margin-top: 6px;
      }
      details pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: inherit;
        color: var(--muted);
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>予定一覧</h1>
      <button id="reload" type="button">再読み込み</button>
    </header>
    <p id="toast" class="status error" hidden></p>
    <main id="app"><p class="status">読み込み中…</p></main>

    <script>
      var RESPONSES = [
        { value: 'accepted', label: '参加' },
        { value: 'tentative', label: '未定' },
        { value: 'declined', label: '欠席' },
      ];
      var STATUS_LABELS = {
        accepted: '参加',
        tentative: '未定',
        declined: '欠席',
        needsAction: '未応答',
        none: '出欠なし',
        '': '未取得',
      };

      var app = document.getElementById('app');
      var toast = document.getElementById('toast');
      var items = [];

      document.getElementById('reload').addEventListener('click', load);
      load();

      function load() {
        showStatus('読み込み中…', false);
        google.script.run
          .withSuccessHandler(function (list) {
            items = list;
            render();
          })
          .withFailureHandler(function (error) {
            showStatus(error.message, true);
          })
          .getAgenda();
      }

      function showStatus(message, isError) {
        app.textContent = '';
        var p = document.createElement('p');
        p.className = isError ? 'status error' : 'status';
        p.textContent = message;
        app.appendChild(p);
      }

      function render() {
        toast.hidden = true;
        app.textContent = '';

        if (items.length === 0) {
          showStatus('表示できる予定がありません', false);
          return;
        }

        var currentDate = null;
        items.forEach(function (item, index) {
          if (item.dateKey !== currentDate) {
            currentDate = item.dateKey;
            var heading = document.createElement('div');
            heading.className = 'day';
            heading.textContent = item.dateLabel;
            app.appendChild(heading);
          }
          app.appendChild(buildCard(item, index));
        });
      }

      function buildCard(item, index) {
        var card = document.createElement('div');
        card.className = item.responseStatus === 'declined' ? 'card declined' : 'card';

        var time = document.createElement('div');
        time.className = 'time';
        time.textContent = item.timeLabel;
        card.appendChild(time);

        var title = document.createElement('div');
        title.className = 'title';
        title.textContent = item.title;
        card.appendChild(title);

        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = statusText(item);
        if (item.pendingResponse) meta.appendChild(badge('反映待ち', 'pending'));
        if (item.responseError) meta.appendChild(badge(item.responseError, 'error'));
        card.appendChild(meta);

        if (item.location) {
          var location = document.createElement('div');
          location.className = 'meta';
          location.textContent = item.location;
          card.appendChild(location);
        }

        if (item.detail) card.appendChild(buildDetail(item.detail));
        card.appendChild(buildActions(item, index));
        card.appendChild(buildNote(item, index));

        return card;
      }

      function statusText(item) {
        if (!item.canRespond) return '出欠のない予定';
        return '出欠: ' + (STATUS_LABELS[item.responseStatus] || item.responseStatus);
      }

      function badge(text, className) {
        var span = document.createElement('span');
        span.className = 'badge ' + className;
        span.textContent = text;
        return span;
      }

      function buildDetail(detail) {
        var wrapper = document.createElement('details');
        var summary = document.createElement('summary');
        summary.textContent = '詳細';
        var body = document.createElement('pre');
        body.textContent = detail;
        wrapper.appendChild(summary);
        wrapper.appendChild(body);
        return wrapper;
      }

      function buildActions(item, index) {
        var actions = document.createElement('div');
        actions.className = 'actions';

        RESPONSES.forEach(function (response) {
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = response.label;
          var current = item.pendingResponse || item.responseStatus;
          if (current === response.value) button.className = 'selected';
          button.disabled = !item.canRespond;
          button.addEventListener('click', function () {
            submit(index, { eventId: item.eventId, response: response.value }, actions);
          });
          actions.appendChild(button);
        });

        return actions;
      }

      function buildNote(item, index) {
        var note = document.createElement('textarea');
        note.placeholder = 'メモ（集約カレンダーにだけ保存されます）';
        note.value = item.note;
        note.addEventListener('blur', function () {
          if (note.value === item.note) return;
          submit(index, { eventId: item.eventId, note: note.value }, note);
        });
        return note;
      }

      function submit(index, submission, target) {
        setBusy(target, true);
        google.script.run
          .withSuccessHandler(function (updated) {
            items[index] = updated;
            render();
          })
          .withFailureHandler(function (error) {
            setBusy(target, false);
            showToast(error.message);
          })
          .submitResponse(submission);
      }

      function showToast(message) {
        toast.textContent = message;
        toast.hidden = false;
      }

      function setBusy(target, busy) {
        if (target.tagName === 'TEXTAREA') {
          target.disabled = busy;
          return;
        }
        Array.prototype.forEach.call(target.children, function (child) {
          child.disabled = busy;
        });
      }
    </script>
  </body>
</html>
